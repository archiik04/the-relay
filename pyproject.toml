[project]
name = "the-relay"
version = "0.1.0"
description = "Reliability-aware RAG over three pinned arXiv papers, with a Groq gateway and a calibrated stand-in."
requires-python = ">=3.11,<3.12"
# Dependencies are added per milestone, only when a milestone needs them.
# M0: fetching + verifying papers, settings.
dependencies = [
    "httpx>=0.27",
    "numpy>=2.4.6",
    "pydantic-settings>=2.4",
    "pymupdf>=1.24",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.3.0",
    "tiktoken>=0.14.0",
]

[dependency-groups]
dev = [
    "pypdf>=7.0.1",
    "pytest>=8",
    "reportlab>=5.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
